<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AXES</title>
<style>
  body{background:#0d0d0f;color:#00eaff;font-family:monospace;text-align:center;padding-top:40px;}
  pre{background:#111;padding:20px;border:1px solid #00eaff;border-radius:4px;display:inline-block;text-align:left;}
  input{margin:5px;padding:4px;}
</style>
</head>
<body>

<h1>48‑ACHSEN‑TUNING</h1>

<input id="term" placeholder="Begriff z.B. QI">
<input id="sharp" type="number" step="0.1" min="0" max="1" value="1">
<button onclick="go()">tune</button>

<pre id="out">bereit…</pre>

<script type="module">
import { tune } from './axes.core.js';

window.go = function(){
  const term  = document.getElementById("term").value || "QI";
  const sharp = parseFloat(document.getElementById("sharp").value) || 1;
  const data  = tune(term, sharp);
  document.getElementById("out").textContent =
    JSON.stringify(data, null, 2);
};
</script>

</body>
</html>
